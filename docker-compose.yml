name: turnos-odontologia

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: turnos
      POSTGRES_PASSWORD: turnos_dev
      POSTGRES_DB: turnos
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnos -d turnos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://turnos:turnos_dev@postgres:5432/turnos
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "app.workers.main"]

  web:
    build: ./frontend
    env_file: .env
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
